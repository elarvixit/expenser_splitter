<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Splitter Tests</title>
  <style>
    :root { --orange: #EA580C; --ink: #1C1512; --muted: #7C6F66; --line: #F1E4D8; --ok: #EA580C; --bad: #B42318; }
    body { margin: 0; background: #FFFBF7; color: var(--ink); font: 14px/1.5 system-ui, sans-serif; }
    main { max-width: 820px; margin: 0 auto; padding: 40px 16px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .summary { color: var(--muted); margin-bottom: 24px; }
    .summary strong { color: var(--ink); }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 24px 0 8px; }
    .row { display: flex; gap: 10px; padding: 8px 12px; background: #fff; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; }
    .mark { font-weight: 700; color: var(--ok); }
    .fail .mark { color: var(--bad); }
    pre { margin: 6px 0 0; white-space: pre-wrap; color: var(--bad); font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Balance engine tests</h1>
    <div class="summary" id="summary">Running…</div>
    <div id="out"></div>
  </main>
  <script src="../src/balances.js"></script>
  <script src="balances.test.js"></script>
  <script src="../src/categories.js"></script>
  <script src="categories.test.js"></script>
  <script>
    const results = window.TEST_RESULTS || [];
    const failed = results.filter(r => !r.ok).length;
    document.getElementById('summary').innerHTML =
      `<strong>${results.length - failed} / ${results.length} passed</strong>` + (failed ? ` — ${failed} failing` : ' — all green');
    const out = document.getElementById('out');
    let group = null;
    for (const r of results) {
      if (r.group !== group) {
        group = r.group;
        const h = document.createElement('h2'); h.textContent = group; out.appendChild(h);
      }
      const row = document.createElement('div');
      row.className = 'row' + (r.ok ? '' : ' fail');
      const mark = document.createElement('span'); mark.className = 'mark'; mark.textContent = r.ok ? '✓' : '✗';
      const body = document.createElement('div'); body.textContent = r.name;
      if (!r.ok) { const pre = document.createElement('pre'); pre.textContent = r.error; body.appendChild(pre); }
      row.append(mark, body); out.appendChild(row);
    }
    document.title = (failed ? '✗ ' : '✓ ') + 'Splitter Tests';
  </script>
</body>
</html>
